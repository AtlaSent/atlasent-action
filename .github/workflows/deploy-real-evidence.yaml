name: AtlaSent Deploy Gate (Real PR Evidence)

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  # The gate mints the run's workload identity from GitHub OIDC and refuses
  # to fall back to a caller-supplied actor when it cannot (fail-closed).
  # Without this, every run stopped at "GitHub OIDC is unavailable".
  id-token: write
  pull-requests: read
  statuses: write

jobs:
  deploy:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: AtlaSent authorization gate
        id: gate
        uses: ./
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          ATLASENT_BASE_URL: ${{ secrets.ATLASENT_BASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          action: production.deploy
          actor: ${{ github.actor }}
          target-id: ${{ github.repository }}
          environment: production
          # Approvals come from the merged PR's real reviews. No change window
          # is asserted here: the runtime enforces it server-side, and a value
          # typed into `context` is never evidence. Full chain:
          # docs/github-gate.md.
          approvals-from: pr-reviews

      - name: Deploy to production
        run: |
          echo "Decision:     ${{ steps.gate.outputs.decision }}"
          echo "Verified:     ${{ steps.gate.outputs.verified }}"
          echo "Evaluation:   ${{ steps.gate.outputs.evaluation-id }}"
          echo "Proof hash:   ${{ steps.gate.outputs.proof-hash }}"
          echo "Risk score:   ${{ steps.gate.outputs.risk-score }}"
          echo ""
          echo "Replace this with the real production deploy command."
