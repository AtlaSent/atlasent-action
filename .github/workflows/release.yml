name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual runs are a DRY RUN: build + verify dist only. They never run the
  # gate, sign, create a Release or move v1. The org's package.release policy
  # only authorizes a `push` of a v<semver> tag for this workflow, and the old
  # `bootstrap` input (skip the gate for the first-ever publish) is gone: v1
  # exists, and a gate-skip input is a standing bypass of the gate.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build and verify (dry run only; publishing requires pushing a vX.Y.Z tag)'
        default: 'main'

permissions:
  contents: write
  id-token: write   # required for cosign keyless signing (Sigstore OIDC)
  statuses: write   # required for the AtlaSent gate's best-effort commit-status post

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # required for cosign keyless signing (Sigstore OIDC)
      statuses: write   # required for the AtlaSent gate's best-effort commit-status post
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      # The committed dist/index.js is the artifact GitHub Actions runs. It must
      # already match source at release time — we verify rather than commit, so
      # the release never mutates the repo (the old approach git-pushed on a
      # detached HEAD during tag builds and failed).
      - name: Verify committed dist is current
        run: |
          if ! git diff --quiet -- dist/index.js; then
            echo "::error::dist/index.js is out of date with src/. Run 'npm run build' and commit dist/index.js before tagging a release."
            git --no-pager diff --stat -- dist/index.js
            exit 1
          fi

      # ── AtlaSent release gate (dogfood) ───────────────────────────────────
      # Gated on the action's OWN code (uses: ./), so each release is authorized
      # by the very build it is releasing. Runs on every tag push; there is no
      # gate-skip input (the one-time `bootstrap` bypass was removed once v1
      # existed). Manual dispatches never reach this step: they are dry runs,
      # and every step after this one that signs or publishes is push-only.
      #
      # POLICY: the `package.release` template that authorizes this workflow
      # binds `workflow: Release` + `event_name: push` + `refs/tags/v<X.Y.Z>`.
      # Renaming this workflow, or dispatching a different workflow on a
      # v-tag ref, therefore turns the gate into a guaranteed deny.
      #
      # TROUBLESHOOTING — none of these has ever needed an atlasent-action
      # code change. Do NOT "fix" a gate failure by spoofing the actor or
      # reshaping the context below:
      #   - "Authentication failed (HTTP 401)" is returned before any policy
      #     is evaluated: the `ATLASENT_API_KEY` / `ATLASENT_BASE_URL` repo
      #     secrets do not resolve to an active key. Verify or rotate them.
      #   - "No template condition matched" on a real tag push: policy
      #     templates are seeded per organization, so check WHICH
      #     organization the pipeline's `ATLASENT_API_KEY` authenticates as
      #     and read that organization's real `package.release` policy
      #     before changing anything here. Adding speculative `context.*`
      #     fields will not help.
      #   - A tag push has no pull request of its own, so the approvals
      #     reader may log "PR #N has 0 approving reviews" for the most
      #     recently merged PR. The release-manager template does not read
      #     approvals, so that line is informational, not the deny cause.
      #   - If the workload-identity mint is refused, the action logs a
      #     warning and falls back to the `actor` input below; that fallback
      #     is the documented, working path.
      - name: AtlaSent release gate
        if: ${{ github.event_name == 'push' }}
        uses: ./
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          ATLASENT_BASE_URL: ${{ secrets.ATLASENT_BASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Must be a GATE_PERMITTED_ACTIONS value (src/canonicalAction.ts):
          # production.deploy | package.release. `package.release` is the
          # canonical "release a package" action and the correct fit for
          # gating the action's own release. The previous value
          # `production.release` is not in the allowlist, so the gate
          # self-rejected with "unsupported protected action" before ever
          # calling the API — blocking every release after the allowlist was
          # tightened. (Requires a package.release policy on the gate org to
          # ALLOW; otherwise it fails closed by design.)
          action: package.release
          actor: ${{ github.actor }}
          environment: prod
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}"}'

      # ── R4: cosign keyless signing ────────────────────────────────────────
      - name: Install cosign
        if: ${{ github.event_name == 'push' }}
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign dist/index.js (keyless, Sigstore Fulcio + Rekor)
        if: ${{ github.event_name == 'push' }}
        # cosign uses the GitHub Actions OIDC token — no long-lived key secret.
        # The resulting bundle (dist/index.js.bundle) contains the certificate
        # chain and transparency-log entry needed to verify the signature.
        run: |
          cosign sign-blob \
            --yes \
            --bundle=dist/index.js.bundle \
            dist/index.js

      - name: Verify signature
        if: ${{ github.event_name == 'push' }}
        # Smoke-test: re-verify using the bundle we just produced.
        run: |
          cosign verify-blob \
            --bundle=dist/index.js.bundle \
            --certificate-identity-regexp='https://github.com/(?i:atlasent)/atlasent-action/.github/workflows/release.yml@.*' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            dist/index.js

      # ── Resolve which tag (if any) to publish ─────────────────────────────
      # Only a tag push publishes. A manual dispatch is a dry run whatever its
      # `ref` input says: it ran no gate, so it must not create a Release or
      # move v1.
      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dry run::Manual dispatch built and verified dist/index.js only. To release, push a vX.Y.Z tag."
          fi

      # ── Publish the GitHub Release (this is what lists the action) ─────────
      - name: Create GitHub Release
        if: ${{ steps.rel.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/index.js.bundle --clobber
          else
            gh release create "$tag" \
              dist/index.js.bundle \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi

      # ── Move the floating v1 tag to this release ──────────────────────────
      # Customers reference `uses: Atlasent/atlasent-action@v1`, so
      # v1 must track the latest v1.x release. Replaces the old workflow that
      # force-pushed v1 to a hardcoded, drift-prone SHA.
      - name: Update floating v1 tag
        if: ${{ steps.rel.outputs.publish == 'true' && startsWith(steps.rel.outputs.tag, 'v1.') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1 '${{ steps.rel.outputs.tag }}'
          git push origin refs/tags/v1 --force
