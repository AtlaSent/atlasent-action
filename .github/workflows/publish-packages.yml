# Publish the AtlaSent npm packages (@atlasent/enforce, @atlasent/action).
#
# These are the library surfaces that live in this repo's workspaces — distinct
# from the GitHub Action itself (which ships as the committed dist/index.js
# bundle via release.yml). They publish to npm so SDK/example consumers can
# `npm install @atlasent/action`.
#
# Trigger: push a tag matching `npm-v<semver>` (e.g. npm-v2.0.1). A tag push is
# the only thing that publishes. A manual run is a dry run (build + test only):
# the org's package.release policy only authorizes a `push` of an npm-v tag for
# this workflow, and there is no gate-skip input.
#
# Setup required once per package: npm trusted publishing (OIDC) — no
# NPM_TOKEN. On npmjs.com -> @atlasent/enforce and @atlasent/action ->
# Settings -> Trusted Publisher -> GitHub Actions: organization `Atlasent`,
# repository `atlasent-action`, workflow `publish-packages.yml`, no
# environment, "Allow npm publish" checked. npm authenticates the workflow's
# id-token (id-token: write), which also signs the provenance attestation.
#
# Order matters: @atlasent/action depends on @atlasent/enforce, so enforce is
# published first. Bump both package versions to the same number before tagging.

name: Publish packages

on:
  push:
    tags:
      - 'npm-v*.*.*'
  # Dry run only: build + test, never publishes and never calls the gate.
  # The former `publish` and `skip_gate` inputs are gone. `skip_gate` let a
  # manual run publish to npm with no authorization at all, which is exactly
  # what this gate exists to prevent.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for npm provenance (Sigstore OIDC)
  statuses: write   # required for the AtlaSent gate's best-effort commit-status post

jobs:
  # ── AtlaSent publish gate (dogfood) ─────────────────────────────────────
  # This workflow is a SECOND, independent npm-publish surface in this repo —
  # release.yml (which ships the dist/index.js action bundle as a GitHub
  # Release) already gates its release with `package.release`, but this
  # separate tag trigger (`npm-v*.*.*`), which publishes the real, public
  # @atlasent/enforce and @atlasent/action packages to the npm registry, had
  # NO AtlaSent authorization check of any kind. Found by the same
  # dogfooding-audit sweep that gated the equivalent publish surfaces in
  # atlasent-control-plane (image/tenant/Terraform-apply workflows) and
  # atlasent-keys (trust-root publish).
  #
  # Gated on the action's OWN code (uses: ./), same as release.yml and
  # create-v1-tag.yml in this repo — each publish is authorized by the very
  # build it is publishing. Same `package.release` action type as
  # release.yml: publishing @atlasent/action and @atlasent/enforce to npm is
  # the same class of "release a package" decision as cutting the action's
  # GitHub Release, just via a different distribution channel — prefer this
  # repo's own internal-consistency precedent over the `production.deploy`
  # convention used by unrelated repos' image/artifact gates.
  #
  # No dedicated GitHub Environment — mirrors release.yml, the closest
  # precedent (also a version-tag-triggered package release), which reads
  # ATLASENT_API_KEY as a bare repo secret. This is a deliberately different
  # choice from create-v1-tag.yml's dedicated `tag-authority` Environment,
  # which exists because repointing the floating `v1` alias is a rarer,
  # higher-blast-radius, org-wide trust operation than an ordinary version
  # release.
  #
  # POLICY: the org's `package.release` bundle had no template for this
  # workflow before v7, so every npm-v tag push was denied (NO_TEMPLATE_MATCH).
  # v7 (atlasent-api docs/runbooks/PACKAGE_RELEASE_V7_APPLY.md) adds
  # `package_release_atlasent_action_npm_packages_tag_release_manager`: this
  # repo + `Publish packages` + `push` + `refs/tags/npm-v<semver>` +
  # artifact `npm-packages`. Keep the workflow name and the artifact string in
  # sync with that template, or the gate goes back to a guaranteed deny.
  # Requires an `ATLASENT_API_KEY` secret (scopes `evaluate:write` +
  # `verify:execute`); until provisioned/activated, every run — including
  # ordinary tag pushes — fails at the gate step.
  gate:
    name: AtlaSent publish gate
    # Tag pushes only. A dispatch is a dry run and must not ask for a permit
    # it will never use (and the policy would deny it anyway).
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write   # required for the AtlaSent gate's best-effort commit-status post
    outputs:
      verified: ${{ steps.atlasent_gate.outputs.verified }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Before anything else: refuse unless the dispatcher (and anyone
      # re-running this attempt) is on .github/production-dispatchers.json.
      - name: Production dispatcher must be on the allowlist
        uses: ./.github/actions/production-dispatcher-check
      - name: AtlaSent publish gate
        id: atlasent_gate
        uses: ./
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          ATLASENT_BASE_URL: ${{ secrets.ATLASENT_BASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Must be a GATE_PERMITTED_ACTIONS value (src/canonicalAction.ts).
          action: package.release
          actor: ${{ github.actor }}
          environment: prod
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}", "artifact": "npm-packages"}'

      - name: Surface gate outcome (deny is loud, and blocks)
        if: ${{ failure() && steps.atlasent_gate.outcome == 'failure' }}
        run: |
          echo "::error title=ATLASENT GATE DID NOT ALLOW::The AtlaSent publish gate step failed (deny/hold/escalate or gate error). Publishing @atlasent/enforce and @atlasent/action to npm is BLOCKED. Actor: ${{ github.actor }}. There is no bypass: fix the policy or the key, then push a new npm-v tag."

  publish:
    name: Publish
    needs: gate
    # On a dispatch the gate job is skipped; still build + test (dry run). On a
    # tag push this job runs only if the gate job succeeded.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.gate.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Before anything else: refuse unless the dispatcher (and anyone
      # re-running this attempt) is on .github/production-dispatchers.json.
      - name: Production dispatcher must be on the allowlist
        uses: ./.github/actions/production-dispatcher-check
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Build both library packages (the action bundle is built separately).
      - run: npm run build -w @atlasent/enforce -w @atlasent/action

      # Run the package test suites (connector + enforce tests).
      - run: npm test -w @atlasent/enforce -w @atlasent/action

      - name: Resolve whether to publish
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dry run::Manual dispatch built and tested only. To publish, push an npm-v<semver> tag."
          fi

      # Publish enforce first (action depends on it), then action. npm uses the
      # publishConfig (access: public, provenance: true) declared in each
      # package.json; --provenance is passed explicitly for clarity.
      #
      # Fail-closed: gated on the AtlaSent gate job's `verified` output in
      # addition to the publish-intent resolution above (push only). Gate error/deny/timeout means these
      # steps do not run.
      # Trusted publishing requires npm >= 11.5.1 (Node 20 ships npm 10.x).
      - name: Upgrade npm for trusted publishing
        if: ${{ steps.resolve.outputs.publish == 'true' && needs.gate.outputs.verified == 'true' }}
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Publish @atlasent/enforce
        if: ${{ steps.resolve.outputs.publish == 'true' && needs.gate.outputs.verified == 'true' }}
        run: npm publish -w @atlasent/enforce --provenance --access public

      - name: Publish @atlasent/action
        if: ${{ steps.resolve.outputs.publish == 'true' && needs.gate.outputs.verified == 'true' }}
        run: npm publish -w @atlasent/action --provenance --access public
