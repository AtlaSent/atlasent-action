name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate action.yml
        run: python3 .github/scripts/validate_action.py

      - run: npm ci

      - run: npm run typecheck

      # dist/index.js bundles packages/enforce/dist (its package.json "main"),
      # not its src. Rebuild that first and require it committed, or a change
      # to packages/enforce/src ships nowhere while every check stays green
      # (the supply_chain assertion was dropped from evaluate this way).
      - run: npm run build -w @atlasent/enforce

      - name: Verify packages/enforce/dist is up to date
        run: |
          if ! git diff --quiet -- packages/enforce/dist; then
            echo "::error::packages/enforce/dist is out of date. Run 'npm run build -w @atlasent/enforce' and commit it."
            git --no-pager diff --stat -- packages/enforce/dist
            exit 1
          fi

      - run: npm run build

      - name: Verify dist is up to date
        run: |
          if ! git diff --quiet -- dist/index.js; then
            echo "::error::dist/index.js is out of date. Run 'npm run build' and commit dist/index.js."
            git --no-pager diff --stat -- dist/index.js
            exit 1
          fi

      - run: npm test

      # ── Azure DevOps Pipelines extension (packages/azure-devops-task) ────────
      # Separate typecheck/build from the root ones above (its own tsconfig,
      # its own esbuild bundle target) — mirrors the precedent already set for
      # @atlasent/enforce and @atlasent/action in publish-packages.yml, but on
      # every PR/push rather than only on a publish tag, since this package's
      # build output (AtlaSentGate/dist/index.js) is a committed runtime
      # artifact an Azure Pipelines agent runs directly, same "commit the
      # runtime artifact" contract as the GitHub Action's own dist/index.js.
      - run: npm run typecheck -w @atlasent/azure-devops-task

      - run: npm run build -w @atlasent/azure-devops-task

      - name: Verify AtlaSentGate/dist/index.js is up to date
        run: |
          if ! git diff --quiet -- packages/azure-devops-task/AtlaSentGate/dist/index.js; then
            echo "::error::packages/azure-devops-task/AtlaSentGate/dist/index.js is out of date. Run 'npm run build -w @atlasent/azure-devops-task' and commit it."
            git --no-pager diff --stat -- packages/azure-devops-task/AtlaSentGate/dist/index.js
            exit 1
          fi

      # Every job that can release this action (a protected environment, or
      # any job in a protected workflow) must check its dispatcher first. js-yaml
      # is not a dependency here, so it is installed, pinned, outside the
      # workspace.
      - name: Install js-yaml 4.3.2 for the dispatcher guard
        run: npm install --prefix "$RUNNER_TEMP/dispatcher-guard-yaml" js-yaml@4.3.2 --no-audit --no-fund --no-save
      - name: Prove the dispatcher guard rejects the defects it targets
        env:
          JS_YAML_MODULE: ${{ runner.temp }}/dispatcher-guard-yaml/node_modules/js-yaml/dist/js-yaml.mjs
        run: node scripts/check-production-dispatcher.mjs --self-test
      - name: Check every release job runs the dispatcher check first
        env:
          JS_YAML_MODULE: ${{ runner.temp }}/dispatcher-guard-yaml/node_modules/js-yaml/dist/js-yaml.mjs
        run: node scripts/check-production-dispatcher.mjs --verify-workflows

      # npm test above (vitest, run from the repo root) already picks up
      # packages/azure-devops-task/src/__tests__/**, same as it already does
      # for packages/enforce and packages/action — no separate test step
      # needed here.
